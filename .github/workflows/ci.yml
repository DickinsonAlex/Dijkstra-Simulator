name: Build, test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Publish web app
        run: dotnet publish src/DijkstraSimulator.Web --configuration Release --output publish

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: publish/wwwroot
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://dijkstra.alexxdickinson.co.uk
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROJECT_NAME: dijkstra-simulator
    steps:
      - name: Check Cloudflare credentials
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets aren't set, so the site wasn't deployed."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v5
        if: steps.check.outputs.ready == 'true'
        with:
          name: web
          path: site

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Create the Pages project (first run only)
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages project create "$PROJECT_NAME" --production-branch main || echo "Project already exists"

      - name: Deploy
        if: steps.check.outputs.ready == 'true'
        run: npx --yes wrangler@4 pages deploy site --project-name "$PROJECT_NAME" --branch main --commit-dirty=true
